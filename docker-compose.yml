services:
  brainlessmusic:
    build: .
    image: brainlessmusic:local
    restart: unless-stopped

    ports:
      # Host:container. Change the host side if 3000 is taken.
      - "3000:3000"

    environment:
      # Required, and enforced by the server itself: it refuses to start on a
      # missing, default, or under-32-character secret and says so plainly.
      # Deliberately not `${JWT_SECRET:?...}` — compose interpolates that on
      # every subcommand, so `build`, `config` and even `down` would fail
      # without a secret they don't need. One clear failure, at boot.
      # Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Put it in a .env file next to this one as JWT_SECRET=...
      JWT_SECRET: ${JWT_SECRET:-}

      # Optional overrides; the image's defaults are usually right.
      # JWT_EXPIRES_IN: 7d
      # MEDIA_TOKEN_TTL: 2h
      # MAX_UPLOAD_SIZE_MB: 100

    volumes:
      # Your music. Read-write, not read-only: uploads through the web UI are
      # filed into this tree.
      - ${LIBRARY_DIR:-./library}:/library

      # Database, extracted cover art, and upload staging. This is the volume
      # worth backing up — playlists, favorites and play history live here and
      # are the only irreplaceable data (step 14).
      - brainlessmusic-data:/data

volumes:
  brainlessmusic-data:

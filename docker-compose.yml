# This project runs in its own containers and shares nothing with anything else
# on the host. The explicit project `name` matters: without it Docker derives
# one from the directory, which is how the unrelated FMS project ended up with
# volumes called `fms-backend_*`. Naming it here keeps every container, volume
# and network this stack creates prefixed `brainlessmusic`/`brainless-`, so a
# `down` on another project can never reach these.
name: brainlessmusic

services:
  brainless-app:
    build: .
    image: brainlessmusic:local
    container_name: brainless-app
    restart: unless-stopped

    ports:
      # Host:container. Change the host side if 3000 is taken.
      - "3000:3000"

    environment:
      # Required, and enforced by the server itself: it refuses to start on a
      # missing, default, or under-32-character secret and says so plainly.
      # Deliberately not `${JWT_SECRET:?...}` — compose interpolates that on
      # every subcommand, so `build`, `config` and even `down` would fail
      # without a secret they don't need. One clear failure, at boot.
      # Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Put it in a .env file next to this one as JWT_SECRET=...
      JWT_SECRET: ${JWT_SECRET:-}

      # Numpad code gating the hidden admin login (see backend/src/config.ts).
      # Unset means /auth/login works with no extra step; set here from .env.
      ADMIN_ENTRY_CODE: ${ADMIN_ENTRY_CODE:-}

      # Optional overrides; the image's defaults are usually right.
      # JWT_EXPIRES_IN: 7d
      # MEDIA_TOKEN_TTL: 2h
      # MAX_UPLOAD_SIZE_MB: 100

    volumes:
      # Your music. Read-write, not read-only: uploads through the web UI are
      # filed into this tree. This is also the app's default library root,
      # registered automatically on first boot — see .docs/features/
      # multi-root-library/planning.md.
      - ${LIBRARY_DIR:-./library}:/library

      # Additional folders — e.g. a second drive's music — go here as more
      # lines, each its own host path -> its own container path. A folder
      # must be bind-mounted here (and the container restarted) before it can
      # be registered as a library root from Options → Library folders; the
      # app can only see what's actually mounted into it.
      # - /mnt/d/old-music:/library-2

      # Database, extracted cover art, and upload staging. This is the volume
      # worth backing up — playlists, favorites and play history live here and
      # are the only irreplaceable data (step 14).
      - brainless-data:/data

volumes:
  brainless-data:

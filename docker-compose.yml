# The explicit name prefixes every container, volume and network `brainlessmusic`/`brainless-`,
# so another project's `down` can't reach them.
name: brainlessmusic

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: brainless-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
     - brainless-app

  brainless-app:
    build: .
    image: brainlessmusic:local
    container_name: brainless-app
    restart: unless-stopped

    ports:
      # Host:container. Change the host side if 3000 is taken.
      - "3000:3000"

    environment:
      # Required: the server refuses a missing, default or short secret. Not `${JWT_SECRET:?}`, which would break
      # `build` and `down` too. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # and put it in a .env file next to this one as JWT_SECRET=...
      JWT_SECRET: ${JWT_SECRET:-}

      # Lets anyone who can reach the server create a (non-admin) account. Fine on a LAN.
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-true}
      ENTRY_CODE: ${ENTRY_CODE:-}
      TRANSCODE_PATH: /data/transcodes
      # Visitors arrive via cloudflared, so rate limits use Cloudflare's real-IP header.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}


      # Optional overrides; the image's defaults are usually right.
      # JWT_EXPIRES_IN: 7d
      # MEDIA_TOKEN_TTL: 2h
      # MAX_UPLOAD_SIZE_MB: 1024

    volumes:
      # Your music, read-write because uploads are filed here. Also the default library root.
      - ${LIBRARY_DIR:-./library}:/library

      # Every Windows drive, read-only, so any can be added from Options → Library folders → Browse.
      # Writes only ever go to the default root. Swap for a narrower line (e.g. /mnt/d/music:/library-2) to expose one drive.
      - /mnt:/mnt:ro

      # Database, cover-art cache and upload staging. Back this one up: playlists, favorites and history live here.
      - brainless-data:/data

volumes:
  brainless-data:

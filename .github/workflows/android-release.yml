# Builds the Android app, signs it with the release key, and attaches the APK to a GitHub Release (A44).
#
# Trigger: push a version tag, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# The tag sets versionName (0.2.0) and versionCode (major*10000 + minor*100 + patch = 200), so every release
# installs over the previous one. Tags must be vMAJOR.MINOR.PATCH and only ever go up.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks (kept locally in ~/.brainlessmusic-signing)
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key share it)
name: Android release

on:
  push:
    tags: ['v*.*.*']
  # Dry run from the Actions tab (or `gh workflow run android-release.yml`): builds and checks the signed APK,
  # publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as (MAJOR.MINOR.PATCH)
        default: '0.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the notes fallback can list commits since the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Held at v5 on purpose: v6 moved caching into a proprietary component with its own terms of use
      # (gradle.com/legal/terms-of-use). v5 is MIT and already on Node 24. Moving to v6 is the owner's call.
      - uses: gradle/actions/setup-gradle@v5

      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="v${{ inputs.version }}"; fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$tag' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          BRAINLESS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BRAINLESS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Check the signature is the release key
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" \
            | tee /dev/stderr | grep -q "CN=brainlessmusic"
          cp "$apk" "$RUNNER_TEMP/brainlessmusic-${{ steps.version.outputs.tag }}.apk"

      # Release notes: android/release-notes/<tag>.md, written by hand for each release (what changed in the
      # app, in plain words). If it is missing, the Android commits since the previous tag are listed instead,
      # so a release never goes out without saying what changed.
      - name: Release notes
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "release-notes/$tag.md" ]; then
            cp "release-notes/$tag.md" "$notes"
          else
            prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$tag^" 2>/dev/null || true)
            {
              echo "## Changes to the Android app"
              echo
              git log --no-merges --format='- %s' ${prev:+"$prev.."}HEAD -- . | head -50
            } > "$notes"
          fi
          {
            echo
            echo "## Installing"
            echo
            echo "Download \`brainlessmusic-$tag.apk\` below and open it on your phone. Allow installs from your browser or file manager when asked."
          } >> "$notes"
          cat "$notes"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/brainlessmusic-${{ steps.version.outputs.tag }}.apk" \
            --title "brainlessmusic ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md"

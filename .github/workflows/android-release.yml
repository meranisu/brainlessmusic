# Builds the Android app, signs it with the release key, and attaches the APK to a GitHub Release (A44).
#
# Trigger: push a version tag, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# The tag sets versionName (0.2.0) and versionCode (major*10000 + minor*100 + patch = 200), so every release
# installs over the previous one. Tags must be vMAJOR.MINOR.PATCH and only ever go up.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks (kept locally in ~/.brainlessmusic-signing)
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key share it)
name: Android release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$tag' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          BRAINLESS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BRAINLESS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Check the signature is the release key
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" \
            | tee /dev/stderr | grep -q "CN=brainlessmusic"
          cp "$apk" "$RUNNER_TEMP/brainlessmusic-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/brainlessmusic-${GITHUB_REF_NAME}.apk" \
            --title "brainlessmusic ${GITHUB_REF_NAME}" \
            --notes "Android app ${GITHUB_REF_NAME}. Download the APK below and open it on your phone to install (allow installs from your browser or file manager when asked)."

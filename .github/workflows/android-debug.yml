# Builds the debug APK ("brainlessmusic (debug)", com.brainlessmusic.app.debug) on GitHub instead of this machine,
# where Gradle keeps getting OOM-killed. Nothing is published: the APK is a run artifact, kept 14 days.
#
# Trigger: Actions tab → Android debug build → Run workflow, or
#   gh workflow run android-debug.yml                      # against music.nobrainmusic.my
#   gh workflow run android-debug.yml -f server_url=...    # against another backend
# Then: gh run download --name brainlessmusic-debug
#
# Optional secret ANDROID_DEBUG_KEYSTORE_BASE64: base64 of ~/.android/debug.keystore. With it, every CI build and
# every local debug build share one key, so each installs over the last. Without it each run signs with a fresh
# key, and installing a new one means uninstalling the old debug app first.
name: Android debug build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Backend the app talks to (blank for music.nobrainmusic.my)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v5 on purpose, as in android-release.yml.
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the shared debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; this APK is signed with a one-off key and won't install over an earlier debug build."
            exit 0
          fi
          # Named explicitly: the runner's Android tools don't read ~/.android for the debug key.
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"

      - name: Build debug APK
        env:
          SERVER_URL: ${{ inputs.server_url }}
          BRAINLESS_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: |
          ./gradlew assembleDebug --no-daemon ${SERVER_URL:+-PserverUrl=$SERVER_URL}

      - name: Check the signing key
        env:
          SHARED_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          apk=app/build/outputs/apk/debug/brainlessmusic-debug.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" \
            | grep "SHA-256" | tee "$RUNNER_TEMP/signer.txt"
          if [ "$SHARED_KEY" = true ]; then
            want=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | grep -m1 "SHA256:" | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
            grep -q "$want" "$RUNNER_TEMP/signer.txt" || { echo "APK is not signed with the shared debug key" >&2; exit 1; }
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: brainlessmusic-debug
          path: android/app/build/outputs/apk/debug/brainlessmusic-debug.apk
          if-no-files-found: error
          retention-days: 14

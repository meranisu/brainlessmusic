<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the favicon's navy background and the default ('blue') theme,
         so the browser chrome doesn't clash before a saved theme is read. -->
    <meta name="theme-color" content="#172554" />
    <meta name="description" content="brainlessmusic — a private, self-hosted music streaming server." />
    <meta property="og:title" content="brainlessmusic" />
    <meta property="og:description" content="A private, self-hosted music streaming server." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>brainlessmusic</title>
    <!--
      Applies the saved theme before the first paint.

      Inline and blocking on purpose. Doing it in React means one frame of the
      default palette before the real one arrives, and a whole-page colour
      change on load is the most visible kind of flash there is. Kept to a few
      bytes and wrapped, because storage access throws outright in a browser
      set to block site data, and a theme is never worth a blank page.
    -->
    <script>
      try {
        var t = localStorage.getItem('brainlessmusic.theme');
        document.documentElement.dataset.theme =
          t === 'red' || t === 'void' || t === 'blue' ? t : 'blue';
      } catch (e) {
        document.documentElement.dataset.theme = 'blue';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

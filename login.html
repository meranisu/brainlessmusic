<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brainlessmusic — sign in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-top:#0C3FA0;
    --navy-mid:#071B4D;
    --navy-deep:#0A1024;
    --surface:#151F3D;
    --surface-2:#1D2A4D;
    --offwhite:#F3F6FB;
    --blue:#8CA0E0;
    --orange:#FF5A33;
    --white:#FFFFFF;
    --text-dim:#5C6996;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--white);
    background:var(--navy-deep);
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg, var(--navy-top) 0%, var(--navy-mid) 38%, var(--navy-deep) 100%);
    overflow:hidden;
  }

  /* ===== decorative grid squares, top-right ===== */
  .grid-motif{
    position:absolute; top:-40px; right:-60px; width:420px; height:420px;
    pointer-events:none; opacity:.55;
  }
  .grid-motif .sq{
    position:absolute; border:2px solid rgba(140,160,224,.35); border-radius:2px;
  }
  .grid-motif .sq:nth-child(1){ width:150px; height:150px; top:10px; left:40px; animation:sqdrift 9s ease-in-out infinite; }
  .grid-motif .sq:nth-child(2){ width:110px; height:110px; top:120px; left:180px; animation:sqdrift 11s ease-in-out infinite reverse; }
  .grid-motif .sq:nth-child(3){ width:190px; height:190px; top:170px; left:20px; animation:sqdrift 13s ease-in-out infinite; }
  .grid-motif .sq:nth-child(4){ width:90px; height:90px; top:60px; left:260px; animation:sqdrift 8s ease-in-out infinite reverse; }
  @keyframes sqdrift{
    0%,100%{ transform:translate(0,0); opacity:.5; }
    50%{ transform:translate(-8px,10px); opacity:.9; }
  }

  /* ===== abstract halftone dot-matrix motif (soundwave burst, not a character) ===== */
  .dot-motif{
    position:absolute; top:60px; right:40px; width:220px; height:340px;
    pointer-events:none;
    display:grid; grid-template-columns:repeat(14,1fr); grid-auto-rows:1fr; gap:3px;
    -webkit-mask-image:radial-gradient(ellipse 60% 90% at 50% 40%, #000 55%, transparent 100%);
            mask-image:radial-gradient(ellipse 60% 90% at 50% 40%, #000 55%, transparent 100%);
  }
  .dot-motif span{
    width:100%; aspect-ratio:1; border-radius:50%;
    background:rgba(255,255,255,.5);
    animation:dotshimmer 3.4s ease-in-out infinite;
  }
  @keyframes dotshimmer{
    0%,100%{ opacity:.25; }
    50%{ opacity:.75; }
  }

  /* ===== sweeping light beam ===== */
  .sweep{
    position:absolute; top:0; left:-40%; width:38%; height:100%;
    background:linear-gradient(100deg, transparent 0%, rgba(255,90,51,.55) 45%, rgba(255,255,255,.7) 50%, rgba(255,90,51,.55) 55%, transparent 100%);
    transform:skewX(-18deg);
    animation:sweep 5.5s cubic-bezier(.4,0,.2,1) infinite;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes sweep{
    0%{ left:-40%; opacity:0; }
    8%{ opacity:.9; }
    45%{ opacity:.9; }
    58%{ left:120%; opacity:0; }
    100%{ left:120%; opacity:0; }
  }

  /* ===== white diagonal band with logo lockup ===== */
  .white-band{
    position:relative; margin-top:min(14vh,120px);
    background:var(--offwhite);
    clip-path:polygon(0 12%, 100% 0%, 100% 88%, 0% 100%);
    padding:38px 6vw 46px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    z-index:2;
  }

  .logo-lockup{ display:flex; align-items:center; gap:20px; max-width:560px; margin:0 auto; }
  .logo-mark{
    flex-shrink:0; width:78px; height:78px; border-radius:50%;
    border:5px solid var(--navy-mid);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .logo-mark::after{
    content:''; width:26px; height:26px; border-radius:50%;
    background:var(--orange);
    animation:markpulse 5.5s ease-in-out infinite;
  }
  @keyframes markpulse{
    0%,15%{ background:var(--white); transform:scale(.8); }
    28%,45%{ background:var(--orange); transform:scale(1.15); }
    60%,100%{ background:var(--orange); transform:scale(1); }
  }
  .logo-text .eyebrow{
    font-family:'Barlow Condensed'; font-weight:700; font-size:12px; letter-spacing:2.5px;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:2px;
  }
  .logo-text h1{
    font-family:'Barlow Condensed'; font-weight:900; font-size:44px; letter-spacing:.3px;
    color:var(--navy-mid); line-height:.95; text-transform:lowercase;
  }
  .logo-text h1 span{ color:var(--orange); }

  .bounce-dot{
    position:absolute; width:14px; height:14px; border-radius:50%;
    background:var(--orange); opacity:.85;
    left:calc(6vw + 39px); bottom:14px;
    animation:bounce 2.6s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{ transform:translateY(0); opacity:.4; }
    50%{ transform:translateY(-10px); opacity:.9; }
  }

  /* ===== login card ===== */
  .login-wrap{
    flex:1; display:flex; align-items:flex-start; justify-content:center;
    padding:34px 20px 20px; position:relative; z-index:2;
  }
  .login-card{
    width:100%; max-width:400px; background:var(--surface);
    border-radius:20px; padding:26px 26px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .login-card h2{
    font-family:'Barlow Condensed'; font-weight:700; font-size:13px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--text-dim); margin-bottom:16px;
  }
  .field{ margin-bottom:12px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  label{
    display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px;
    font-weight:600; letter-spacing:.3px;
  }
  input[type=text], input[type=password]{
    width:100%; background:var(--navy-deep); border:1px solid var(--surface-2);
    color:var(--white); padding:10px 12px; border-radius:9px;
    font-family:'Inter'; font-size:13px; transition:border-color .15s;
  }
  input:focus{ outline:none; border-color:var(--orange); }

  .advanced-toggle{
    background:none; border:none; color:var(--blue); font-size:11.5px;
    font-weight:600; cursor:pointer; padding:4px 0 12px; display:flex; align-items:center; gap:5px;
  }
  .advanced-fields{ display:none; }
  .advanced-fields.open{ display:block; }

  .signin-btn{
    width:100%; background:var(--orange); color:var(--white); border:none;
    padding:13px; border-radius:12px; font-weight:700; font-size:14px;
    cursor:pointer; font-family:'Inter'; margin-top:6px;
    transition:filter .15s, transform .1s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .signin-btn:hover{ filter:brightness(1.1); }
  .signin-btn:active{ transform:scale(.98); }
  .signin-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .signin-btn .spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4); border-top-color:var(--white);
    animation:spin .7s linear infinite; display:none;
  }
  .signin-btn.loading .spinner{ display:block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .status-msg{
    font-size:12px; margin-top:14px; padding:10px 12px; border-radius:9px; display:none;
  }
  .status-msg.show{ display:flex; align-items:center; gap:8px; }
  .status-msg.err{ background:rgba(255,90,51,.14); color:var(--orange); }
  .status-msg.ok{ background:rgba(127,212,140,.14); color:#7FD48C; }

  .continue-btn{
    display:none; width:100%; margin-top:10px; text-align:center; text-decoration:none;
    background:var(--surface-2); color:var(--white); padding:12px; border-radius:12px;
    font-weight:700; font-size:13px; font-family:'Inter';
  }
  .continue-btn.show{ display:block; }

  #reqlog{
    margin-top:14px; background:var(--navy-deep); border-radius:9px; padding:10px;
    font-size:10px; color:var(--text-dim); max-height:110px; overflow-y:auto;
    font-family:ui-monospace,monospace; white-space:pre-wrap; word-break:break-all;
    display:none;
  }
  .logtoggle{
    background:none; border:none; color:var(--text-dim); font-size:10.5px;
    cursor:pointer; margin-top:10px; text-decoration:underline;
  }

  /* ===== bottom bar ===== */
  .bottom-bar{
    position:relative; z-index:2;
    background:var(--navy-deep); border-top:1px solid rgba(140,160,224,.15);
    padding:14px 6vw 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .tagline{ font-size:11.5px; color:var(--blue); font-weight:500; }
  .icon-row{ display:flex; align-items:center; gap:14px; color:var(--text-dim); }
  .icon-row span{ font-family:'Barlow Condensed'; font-size:11px; letter-spacing:1px; font-weight:700; }

  @media (max-width:480px){
    .logo-text h1{ font-size:34px; }
    .white-band{ padding:30px 6vw 34px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="grid-motif">
    <div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div>
  </div>
  <div class="dot-motif" id="dotMotif"></div>
  <div class="sweep"></div>

  <div class="white-band">
    <div class="logo-lockup">
      <div class="logo-mark"></div>
      <div class="logo-text">
        <div class="eyebrow">Self-hosted · Personal audio</div>
        <h1>brainless<span>music</span></h1>
      </div>
    </div>
    <div class="bounce-dot"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <h2>Sign in to your server</h2>

      <div class="field"><label>Username</label><input type="text" id="username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="password" autocomplete="current-password"></div>

      <button class="advanced-toggle" id="advToggle">
        <svg id="advChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="transition:transform .2s;"><path d="M6 9l6 6 6-6"/></svg>
        Server settings
      </button>
      <div class="advanced-fields" id="advFields">
        <div class="field"><label>API base URL</label><input type="text" id="baseUrl" value="http://localhost:3000"></div>
        <div class="field-row">
          <div><label>Login path</label><input type="text" id="loginPath" value="/auth/login"></div>
        </div>
      </div>

      <button class="signin-btn" id="signinBtn">
        <span class="spinner"></span>
        <span id="signinLabel">Sign in</span>
      </button>

      <div class="status-msg" id="statusMsg"></div>
      <a class="continue-btn" id="continueBtn" href="#">Continue to library →</a>

      <button class="logtoggle" id="logToggle">show request log</button>
      <div id="reqlog"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="tagline">Stream your own library, wherever you ride.</div>
    <div class="icon-row">
      <span>FLAC · OPUS · MP3</span>
      <span>v0.1 — test build</span>
    </div>
  </div>
</div>

<script>
  // Build the abstract dot-matrix motif
  const dm = document.getElementById('dotMotif');
  const cols = 14, rows = 20;
  for(let i=0;i<cols*rows;i++){
    const d = document.createElement('span');
    d.style.animationDelay = (Math.random()*3.4).toFixed(2)+'s';
    dm.appendChild(d);
  }

  const $ = id => document.getElementById(id);

  $('advToggle').onclick = () => {
    $('advFields').classList.toggle('open');
    $('advChevron').style.transform = $('advFields').classList.contains('open') ? 'rotate(180deg)' : 'rotate(0)';
  };
  $('logToggle').onclick = () => {
    const box = $('reqlog');
    const on = box.style.display === 'block';
    box.style.display = on ? 'none' : 'block';
    $('logToggle').textContent = on ? 'show request log' : 'hide request log';
  };

  function log(kind, text){
    const box = $('reqlog');
    const div = document.createElement('div');
    div.style.color = kind==='err' ? 'var(--orange)' : (kind==='ok' ? '#7FD48C' : 'var(--blue)');
    div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
    box.prepend(div);
  }

  function setStatus(kind, msg){
    const el = $('statusMsg');
    el.className = 'status-msg show ' + kind;
    el.textContent = msg;
  }

  $('signinBtn').onclick = async () => {
    const base = $('baseUrl').value.replace(/\/$/,'');
    const url = base + $('loginPath').value;
    const body = { username: $('username').value, password: $('password').value };

    $('signinBtn').classList.add('loading');
    $('signinBtn').disabled = true;
    $('signinLabel').textContent = 'Signing in…';
    $('continueBtn').classList.remove('show');
    log('req', `POST ${url}`);

    try {
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const text = await res.text();
      let data; try{ data = JSON.parse(text); }catch{ data = null; }

      if(!res.ok){
        log('err', `${res.status} ${res.statusText} — ${text.slice(0,200)}`);
        setStatus('err', `Sign-in failed: ${res.status} ${res.statusText}`);
        return;
      }
      const token = data && (data.token || data.accessToken || data.access_token || data.jwt);
      if(!token){
        log('err', `200 OK but no token field found. Raw: ${text.slice(0,300)}`);
        setStatus('err', 'Logged in but no token field found in the response — check the log.');
        return;
      }
      log('ok', 'Signed in — token acquired.');
      setStatus('ok', 'Signed in successfully.');
      const dest = 'library-player.html?base=' + encodeURIComponent(base) + '&token=' + encodeURIComponent(token);
      $('continueBtn').href = dest;
      $('continueBtn').classList.add('show');
    } catch(e){
      log('err', `Network error: ${e.message}`);
      setStatus('err', `Network error: ${e.message}`);
    } finally {
      $('signinBtn').classList.remove('loading');
      $('signinBtn').disabled = false;
      $('signinLabel').textContent = 'Sign in';
    }
  };
</script>
</body>
</html>
